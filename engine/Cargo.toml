[package]
name = "uandup-engine"
version = "0.1.0"
edition = "2024"
license = "0BSD"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = { version = "0.18", default-features = false }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
